# HTTP bootstrap only; install before issuing the staging certificate.
server {
    listen 80;
    listen [::]:80;
    server_name staging.e-hub.com.vn;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/ehub-staging.access.log;
    error_log /var/log/nginx/ehub-staging.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Authentication cookies require HTTPS, so the app is not served by bootstrap.
    location / {
        default_type text/plain;
        return 200 "EHUB staging initialization\n";
    }
}
