map $http_upgrade $ehub_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name e-hub.com.vn www.e-hub.com.vn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://e-hub.com.vn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.e-hub.com.vn;

    ssl_certificate /etc/letsencrypt/live/e-hub.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-hub.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://e-hub.com.vn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name e-hub.com.vn;

    ssl_certificate /etc/letsencrypt/live/e-hub.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-hub.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # This snippet trusts CF-Connecting-IP only when the TCP peer belongs to
    # an official Cloudflare range. Direct callers cannot forge the real IP.
    include /etc/nginx/snippets/ehub-cloudflare-real-ip.conf;

    server_tokens off;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/e-hub.access.log;
    error_log /var/log/nginx/e-hub.error.log warn;

    # Do not expose dependency status publicly. Local monitoring still works.
    location ~ ^/health(?:z|/live|/ready)?$ {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The real-ip module has already reduced the trusted Cloudflare header
        # to one validated visitor address. Do not preserve arbitrary chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ehub_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
