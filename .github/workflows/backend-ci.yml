name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore EHub.slnx

      - name: Build solution
        run: dotnet build EHub.slnx --configuration Release --no-restore

      - name: Run unit & application tests
        run: dotnet test EHub.slnx --configuration Release --no-build --filter "FullyQualifiedName!~IntegrationTests" --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/EHub.IntegrationTests/EHub.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: true
