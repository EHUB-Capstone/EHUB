map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_for $ehub_forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
}

map $http_x_forwarded_proto $ehub_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # The largest current workbook flow accepts 10 MB. Leave a small margin
    # for multipart boundaries while continuing to reject oversized uploads.
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # Google Sign-In's popup must keep its opener to return the credential.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ehub_forwarded_for;
        proxy_set_header X-Forwarded-For $ehub_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ehub_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Operational health endpoints intentionally remain outside the public
    # API contract while still being reachable through the same gateway.
    location ~ ^/health(?:/live|/ready)?$ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ehub_forwarded_for;
        proxy_set_header X-Forwarded-For $ehub_forwarded_for;
        # Health probes are internal HTTP calls to an HTTPS-only production
        # application. Mark the original public scheme explicitly so the
        # readiness endpoint executes instead of returning a 307 redirect.
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
